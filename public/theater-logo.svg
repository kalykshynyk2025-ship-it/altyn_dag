<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Logo Symbol -->
  <g transform="translate(300, 120)">
    <!-- Thin black circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#111111" stroke-width="4"/>
    
    <!-- Red stylized 'И' emblem -->
    <path d="M -32 -55 L -32 55 L 32 -55 A 55 55 0 0 1 32 55" fill="none" stroke="#D32F2F" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text Section -->
  <!-- "Иммерсивный Театр" -->
  <text x="300" y="255" text-anchor="middle" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-style="italic" font-size="40" font-weight="600" fill="#111111">
    Иммерсивный Театр
  </text>
  <!-- Underline -->
  <line x1="80" y1="270" x2="520" y2="270" stroke="#111111" stroke-width="2.5"/>

  <!-- "Народов России" -->
  <text x="300" y="325" text-anchor="middle" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-style="italic" font-size="42" font-weight="700" fill="#D32F2F">
    Народов России
  </text>
</svg>
